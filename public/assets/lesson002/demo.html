<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植树问题动画演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #fafafa;
    display: flex;
    justify-content: center;
    padding: 24px;
    color: #171717;
  }
  .container { max-width: 600px; width: 100%; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 24px; letter-spacing: -0.5px; }
  .info { background: white; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 1px rgba(0,0,0,0.02), 0 2px 2px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.08) inset; }
  .info p { font-size: 14px; line-height: 1.6; color: #4d4d4d; }
  .info strong { color: #171717; }
  .road-container { position: relative; background: white; border-radius: 8px; padding: 32px 16px; margin-bottom: 16px; box-shadow: 0 1px 1px rgba(0,0,0,0.02), 0 2px 2px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.08) inset; }
  .road { position: relative; height: 4px; background: #ebebeb; margin: 0 20px; }
  .road-line { position: absolute; top: 0; left: 0; right: 0; height: 2px; background: repeating-linear-gradient(to right, #a1a1a1 0, #a1a1a1 10px, transparent 10px, transparent 20px); }
  .tree { position: absolute; top: -24px; width: 24px; height: 32px; transform: translateX(-12px); cursor: pointer; transition: transform 0.3s ease; display: flex; flex-direction: column; align-items: center; }
  .tree:hover { transform: translateX(-12px) scale(1.2); }
  .tree-top { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 20px solid #22c55e; }
  .tree-trunk { width: 4px; height: 12px; background: #92400e; border-radius: 2px; }
  .tree-label { position: absolute; bottom: -20px; font-size: 10px; color: #888; white-space: nowrap; }
  .tree-1 { left: 20px; }
  .tree-2 { left: 68px; }
  .tree-3 { left: 116px; }
  .tree-4 { left: 164px; }
  .tree-5 { left: 212px; }
  .tree-6 { left: 260px; }
  .tree-7 { left: 308px; }
  .tree-8 { left: 356px; }
  .tree-9 { left: 404px; }
  .tree-10 { left: 452px; }
  .tree-11 { left: 500px; }
  .tree-12 { left: 548px; }
  .tree-13 { left: 596px; }
  .tree-14 { left: 644px; }
  .tree-15 { left: 692px; }
  .tree-16 { left: 740px; }
  .tree-17 { left: 788px; }
  .tree-18 { left: 836px; }
  .tree-19 { left: 884px; }
  .tree-20 { left: 932px; }
  .tree-21 { left: 980px; }
  .marker { position: absolute; top: -30px; font-size: 10px; color: #0070f3; font-weight: 500; background: #d3e5ff; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
  .marker-end { left: 20px; }
  .marker-start { left: 0px; transform: translateX(-100%); }
  .controls { display: flex; gap: 8px; margin-bottom: 16px; }
  .controls button {
    padding: 8px 20px; border-radius: 100px; border: none; font-size: 14px; font-weight: 500;
    cursor: pointer; background: #171717; color: white; transition: opacity 0.15s;
  }
  .controls button:hover { opacity: 0.85; }
  .controls button.secondary { background: white; color: #171717; border: 1px solid #ebebeb; }
  .steps { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 1px 1px rgba(0,0,0,0.02), 0 2px 2px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.08) inset; }
  .step { padding: 8px 0; border-bottom: 1px solid #f5f5f5; font-size: 14px; line-height: 1.6; color: #4d4d4d; }
  .step:last-child { border-bottom: none; }
  .step .num { display: inline-block; width: 20px; height: 20px; background: #171717; color: white; font-size: 12px; font-weight: 600; text-align: center; line-height: 20px; border-radius: 9999px; margin-right: 8px; }
  .scroll-wrapper { overflow-x: auto; padding-bottom: 12px; }
  .lanes-label { display: flex; justify-content: space-between; margin: 4px 20px 0; font-size: 10px; color: #a1a1a1; }
  @media (max-width: 640px) { .tree-16, .tree-17, .tree-18, .tree-19, .tree-20, .tree-21 { display: none; } }
</style>
</head>
<body>
<div class="container">
  <h1>🌳 植树问题 · 两端都种</h1>
  <div class="info">
    <p><strong>题目：</strong>一条100米的小路，每隔5米种一棵树，两端都种，需要种几棵？</p>
  </div>
  <div class="controls">
    <button onclick="scrollRoad()">▶ 查看所有树</button>
    <button class="secondary" onclick="resetScroll()">重置</button>
  </div>
  <div class="road-container">
    <div class="scroll-wrapper" id="roadWrapper">
      <div style="width: 1000px; position: relative; padding-top: 30px;">
        <div class="road"><div class="road-line"></div></div>
        <div class="tree tree-1"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第1棵</div></div>
        <div class="tree tree-2"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第2棵</div></div>
        <div class="tree tree-3"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第3棵</div></div>
        <div class="tree tree-4"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第4棵</div></div>
        <div class="tree tree-5"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第5棵</div></div>
        <div class="tree tree-6"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第6棵</div></div>
        <div class="tree tree-7"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第7棵</div></div>
        <div class="tree tree-8"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第8棵</div></div>
        <div class="tree tree-9"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第9棵</div></div>
        <div class="tree tree-10"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第10棵</div></div>
        <div class="tree tree-11"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第11棵</div></div>
        <div class="tree tree-12"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第12棵</div></div>
        <div class="tree tree-13"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第13棵</div></div>
        <div class="tree tree-14"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第14棵</div></div>
        <div class="tree tree-15"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第15棵</div></div>
        <div class="tree tree-16"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第16棵</div></div>
        <div class="tree tree-17"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第17棵</div></div>
        <div class="tree tree-18"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第18棵</div></div>
        <div class="tree tree-19"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第19棵</div></div>
        <div class="tree tree-20"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第20棵</div></div>
        <div class="tree tree-21"><div class="tree-top"></div><div class="tree-trunk"></div><div class="tree-label">第21棵</div></div>
        <div class="lanes-label"><span>0m</span><span>5m</span><span>10m</span><span>15m</span><span>20m</span><span>25m</span><span>...</span><span>95m</span><span>100m</span></div>
      </div>
    </div>
  </div>
  <div class="steps">
    <div class="step"><span class="num">1</span> 全长 <strong>100米</strong>，间距 <strong>5米</strong></div>
    <div class="step"><span class="num">2</span> 段数 = 100 ÷ 5 = <strong>20段</strong></div>
    <div class="step"><span class="num">3</span> 两端都种，棵数 = 20 + <strong>1</strong> = <strong>21棵</strong> 🎯</div>
  </div>
</div>
<script>
function scrollRoad() { document.getElementById('roadWrapper').scrollBy({ left: 400, behavior: 'smooth' }); }
function resetScroll() { document.getElementById('roadWrapper').scrollTo({ left: 0, behavior: 'smooth' }); }
</script>
</body>
</html>
