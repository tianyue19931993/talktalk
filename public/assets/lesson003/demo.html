<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鸡兔同笼互动演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #fafafa;
    display: flex;
    justify-content: center;
    padding: 24px;
    color: #171717;
  }
  .container { max-width: 600px; width: 100%; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 24px; letter-spacing: -0.5px; }
  .card { background: white; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 1px rgba(0,0,0,0.02), 0 2px 2px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.08) inset; }
  .problem { font-size: 15px; line-height: 1.7; color: #4d4d4d; }
  .problem strong { color: #171717; }
  .sim-area { text-align: center; }
  .creatures { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 16px 0; min-height: 80px; }
  .creature { display: flex; flex-direction: column; align-items: center; animation: pop 0.3s ease; }
  @keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .chicken-body { width: 32px; height: 28px; background: #fbbf24; border-radius: 50% 50% 40% 40%; position: relative; }
  .chicken-body::before { content: ''; position: absolute; top: -8px; left: 6px; width: 8px; height: 10px; background: #f59e0b; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
  .chicken-body::after { content: '•'; position: absolute; top: -5px; left: 2px; font-size: 8px; }
  .chicken-legs { display: flex; gap: 6px; margin-top: -2px; }
  .chicken-legs span { width: 2px; height: 12px; background: #92400e; border-radius: 1px; display: block; }
  .rabbit-body { width: 36px; height: 30px; background: #d1d5db; border-radius: 45% 45% 40% 40%; position: relative; }
  .rabbit-body::before { content: ''; position: absolute; top: -10px; left: 4px; width: 10px; height: 14px; background: #d1d5db; border-radius: 50% 50% 0 0; }
  .rabbit-body::after { content: ''; position: absolute; top: -10px; right: 4px; width: 10px; height: 14px; background: #d1d5db; border-radius: 50% 50% 0 0; }
  .rabbit-legs { display: flex; gap: 8px; margin-top: -2px; }
  .rabbit-legs span { width: 3px; height: 14px; background: #92400e; border-radius: 1px; display: block; }
  .creature-label { font-size: 10px; margin-top: 2px; color: #888; }
  .stats { display: grid; grid-template-columns: auto auto; gap: 12px; font-size: 14px; }
  .stats div { padding: 8px 12px; background: #f5f5f5; border-radius: 6px; text-align: center; }
  .stats .num { font-size: 24px; font-weight: 600; color: #171717; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .controls button {
    padding: 8px 20px; border-radius: 100px; border: none; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-primary { background: #171717; color: white; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary { background: white; color: #171717; border: 1px solid #ebebeb; }
  .btn-secondary:hover { background: #f5f5f5; }
  .btn-active { background: #0070f3; color: white; }
  .steps { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 1px 1px rgba(0,0,0,0.02), 0 2px 2px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.08) inset; }
  .step { padding: 8px 0; border-bottom: 1px solid #f5f5f5; font-size: 14px; line-height: 1.6; color: #4d4d4d; }
  .step:last-child { border-bottom: none; }
  .step .num { display: inline-block; width: 20px; height: 20px; background: #171717; color: white; font-size: 12px; font-weight: 600; text-align: center; line-height: 20px; border-radius: 9999px; margin-right: 8px; }
  .slider-group { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
  .slider-group label { font-size: 13px; color: #4d4d4d; min-width: 60px; }
  .slider-group input[type="range"] { flex: 1; accent-color: #171717; }
  .slider-group .val { font-size: 14px; font-weight: 600; min-width: 24px; text-align: center; }
</style>
</head>
<body>
<div class="container">
  <h1>🐔🐰 鸡兔同笼 · 互动演示</h1>
  <div class="card">
    <div class="problem">
      <strong>题目：</strong>笼子里有鸡和兔共 <span id="totalHeadsDisplay">35</span> 个头，<span id="totalLegsDisplay">94</span> 条腿。
    </div>
  </div>

  <div class="card">
    <div class="sim-area">
      <div class="slider-group">
        <label>🐔 鸡</label>
        <input type="range" id="chickenSlider" min="0" max="35" value="23" oninput="updateSim()">
        <span class="val" id="chickenCount">23</span>
      </div>
      <div class="slider-group">
        <label>🐰 兔</label>
        <input type="range" id="rabbitSlider" min="0" max="35" value="12" oninput="updateSim()">
        <span class="val" id="rabbitCount">12</span>
      </div>
      <div class="creatures" id="creatureArea"></div>
      <div class="stats">
        <div><div class="num" id="displayHeads">35</div>头</div>
        <div><div class="num" id="displayLegs">94</div>条腿</div>
      </div>
    </div>
  </div>

  <div class="steps" id="stepsArea">
    <div class="step"><span class="num">1</span> 全假设为鸡：<strong id="step1Legs">70</strong> 条腿</div>
    <div class="step"><span class="num">2</span> 差的腿数：<span id="step2Diff">94</span> - <span id="step2AllChicken">70</span> = <strong id="step2Result">24</strong></div>
    <div class="step"><span class="num">3</span> 兔数 = <span id="step3Diff">24</span> ÷ 2 = <strong id="step3Result">12</strong> 只 🎯</div>
    <div class="step"><span class="num">4</span> 鸡数 = <span id="step4Total">35</span> - <span id="step4Rabbits">12</span> = <strong id="step4Result">23</strong> 只 ✅</div>
  </div>

  <div class="controls" style="margin-top: 16px;">
    <button class="btn-primary" onclick="autoSolve()">✏️ 自动解题</button>
    <button class="btn-secondary" onclick="setPreset(35, 94)">35头94腿</button>
    <button class="btn-secondary" onclick="setPreset(20, 54)">20头54腿</button>
    <button class="btn-secondary" onclick="setPreset(50, 140)">50头140腿</button>
  </div>
</div>
<script>
const TOTAL = 35;
const TOTAL_LEGS = 94;

function updateSim() {
  const chickens = parseInt(document.getElementById('chickenSlider').value);
  const rabbits = parseInt(document.getElementById('rabbitSlider').value);
  const heads = chickens + rabbits;
  const legs = chickens * 2 + rabbits * 4;

  // Update display
  document.getElementById('chickenCount').textContent = chickens;
  document.getElementById('rabbitCount').textContent = rabbits;
  document.getElementById('displayHeads').textContent = heads;
  document.getElementById('displayLegs').textContent = legs;
  document.getElementById('rabbitSlider').max = Math.max(0, 35 - chickens);
  document.getElementById('chickenSlider').max = Math.max(0, 35 - rabbits);

  // Update creatures
  const area = document.getElementById('creatureArea');
  area.innerHTML = '';
  for (let i = 0; i < chickens; i++) {
    area.innerHTML += `<div class="creature"><div class="chicken-body"></div><div class="chicken-legs"><span></span><span></span></div><div class="creature-label">鸡</div></div>`;
  }
  for (let i = 0; i < rabbits; i++) {
    area.innerHTML += `<div class="creature"><div class="rabbit-body"></div><div class="rabbit-legs"><span></span><span></span><span></span><span></span></div><div class="creature-label">兔</div></div>`;
  }

  // Highlight if matches
  if (heads === TOTAL && legs === TOTAL_LEGS) {
    document.getElementById('displayHeads').style.color = '#0070f3';
    document.getElementById('displayLegs').style.color = '#0070f3';
  } else {
    document.getElementById('displayHeads').style.color = '';
    document.getElementById('displayLegs').style.color = legs > TOTAL_LEGS ? '#ee0000' : '';
  }

  // Update steps
  const allChickenLegs = TOTAL * 2;
  const diff = legs - allChickenLegs;
  const calcRabbits = diff / 2;
  const calcChickens = TOTAL - calcRabbits;

  // Use TOTAL and TOTAL_LEGS for solving
  const totalDiff = TOTAL_LEGS - TOTAL * 2;
  const solvedRabbits = totalDiff / 2;
  const solvedChickens = TOTAL - solvedRabbits;

  document.getElementById('step1Legs').textContent = TOTAL * 2;
  document.getElementById('step2Diff').textContent = TOTAL_LEGS;
  document.getElementById('step2AllChicken').textContent = TOTAL * 2;
  document.getElementById('step2Result').textContent = totalDiff;
  document.getElementById('step3Diff').textContent = totalDiff;
  document.getElementById('step3Result').textContent = solvedRabbits;
  document.getElementById('step4Total').textContent = TOTAL;
  document.getElementById('step4Rabbits').textContent = solvedRabbits;
  document.getElementById('step4Result').textContent = solvedChickens;
}

function autoSolve() {
  const rabbitSlider = document.getElementById('rabbitSlider');
  const chickenSlider = document.getElementById('chickenSlider');
  const totalDiff = TOTAL_LEGS - TOTAL * 2;
  const solvedRabbits = totalDiff / 2;
  const solvedChickens = TOTAL - solvedRabbits;
  rabbitSlider.value = solvedRabbits;
  chickenSlider.value = solvedChickens;
  updateSim();
}

function setPreset(heads, legs) {
  document.getElementById('totalHeadsDisplay').textContent = heads;
  document.getElementById('totalLegsDisplay').textContent = legs;
  document.getElementById('chickenSlider').max = heads;
  document.getElementById('rabbitSlider').max = heads;
  // Recalculate
  const totalDiff = legs - heads * 2;
  const solvedRabbits = totalDiff / 2;
  const solvedChickens = heads - solvedRabbits;
  if (solvedRabbits >= 0 && solvedChickens >= 0) {
    document.getElementById('chickenSlider').value = solvedChickens;
    document.getElementById('rabbitSlider').value = solvedRabbits;
  } else {
    document.getElementById('chickenSlider').value = 0;
    document.getElementById('rabbitSlider').value = 0;
  }
  updateSim();

  // Update step display for new TOTAL
  setTimeout(() => {
    document.getElementById('step1Legs').textContent = heads * 2;
    document.getElementById('step2Diff').textContent = legs;
    document.getElementById('step2AllChicken').textContent = heads * 2;
    const diff = legs - heads * 2;
    document.getElementById('step2Result').textContent = diff;
    document.getElementById('step3Diff').textContent = diff;
    document.getElementById('step3Result').textContent = solvedRabbits;
    document.getElementById('step4Total').textContent = heads;
    document.getElementById('step4Rabbits').textContent = solvedRabbits;
    document.getElementById('step4Result').textContent = solvedChickens;
  }, 50);
}

autoSolve();
</script>
</body>
</html>
